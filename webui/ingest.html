<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyCLIP — Ingest</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar"></header>

<main class="page">

	<section class="panel">
		<h2>1 — Enqueue tagged images</h2>
		<div class="row">
			<label for="tag-input">Tag</label>
			<input type="text" id="tag-input" value="hyclip:ingest">
		</div>
		<div class="row">
			<label for="max-input">Max to evaluate</label>
			<input type="number" id="max-input" min="1" placeholder="all">
		</div>
		<div class="row">
			<button id="enqueue-btn" class="btn" data-requires="hydrus">Enqueue new images</button>
		</div>
	</section>

	<section class="panel">
		<h2>2 — Process queue</h2>
		<div class="row">
			<label for="batch-input">Batch size</label>
			<input type="number" id="batch-input" min="1" max="200" value="20">
		</div>
		<div class="row">
				<button id="start-btn" class="btn primary">Start evaluation</button>
			<button id="stop-btn" class="btn" hidden>Stop</button>
		</div>
		<progress id="ingest-progress" value="0" max="1"></progress>
		<div class="hint">Queue: <span id="queue-count">…</span></div>
		<div id="ingest-counts" class="hint"></div>
	</section>

</main>

<footer id="statusbar">Ready</footer>

<script src="shared.js"></script>
<script src="ingest.js"></script>
</body>
</html>
